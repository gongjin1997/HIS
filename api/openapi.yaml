openapi: 3.1.0
info:
  title: kinstall Control Plane API
  version: 1.0.0
  description: 'Single-binary, agentless, offline-first infrastructure installation, lifecycle & CMDB control plane API. Contract-first
    SSOT (ADR-021, G1 §2).

    '
servers:
- url: /
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      responses:
        '200':
          description: OK
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe (returns 503 while draining)
      responses:
        '200':
          description: Ready
        '503':
          description: Draining or DB unavailable
  /api/v1/auth/login:
    post:
      operationId: loginLocal
      summary: Local Argon2id login (5-fail 15m 423 lockout)
      responses:
        '200':
          description: Authenticated session
        '401':
          $ref: '#/components/responses/Problem'
        '423':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/oidc/config:
    get:
      operationId: getOidcConfig
      summary: Query whether OIDC PKCE S256 SSO is enabled
      responses:
        '200':
          description: OIDC configuration
  /api/v1/auth/oidc/login:
    get:
      operationId: startOidcLogin
      summary: Initiate OIDC Authorization Code + PKCE S256 login flow
      responses:
        '302':
          description: Redirect to OIDC IdP
  /api/v1/auth/oidc/callback:
    get:
      operationId: completeOidcCallback
      summary: Exchange OIDC authorization code + PKCE verifier for server session
      responses:
        '200':
          description: Authenticated OIDC session
  /api/v1/auth/logout:
    post:
      operationId: logoutSession
      summary: Revoke current server-side session immediately
      responses:
        '204':
          description: Logged out
  /api/v1/auth/tokens:
    get:
      operationId: listApiTokens
      summary: List caller API tokens
      responses:
        '200':
          description: OK
    post:
      operationId: createApiToken
      summary: Issue scoped short-lived API token (ki_<8>_<32>)
      responses:
        '201':
          description: Created
  /api/v1/plugins:
    get:
      operationId: listPlugins
      summary: List registered component & extension plugins
      responses:
        '200':
          description: OK
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      responses:
        '200':
          description: OK
    post:
      operationId: createProject
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{projectId}/hosts:
    get:
      operationId: listHosts
      summary: List CMDB hosts in project
      responses:
        '200':
          description: OK
    post:
      operationId: createHost
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/hosts/{hostId}:probe:
    post:
      operationId: probeHostFacts
      summary: Execute 1-RTT POSIX Facts probe
      responses:
        '200':
          description: Updated host facts
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: hostId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/media-policies:
    get:
      operationId: listMediaPolicies
      summary: List Local / OBS·S3 / Online media policies (ADR-077)
      responses:
        '200':
          description: OK
    post:
      operationId: createMediaPolicy
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/media-policies/{policyId}:
    put:
      operationId: updateMediaPolicy
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Updated
        '412':
          $ref: '#/components/responses/Problem'
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: policyId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/media-policies/{policyId}:test:
    post:
      operationId: testMediaPolicyConnectivity
      summary: Probe Local / Huawei OBS / S3 / Online reachability
      responses:
        '200':
          description: Connectivity probe report
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: policyId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/instances:
    get:
      operationId: listInstances
      summary: List managed product instances
      responses:
        '200':
          description: OK
    post:
      operationId: createInstance
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/instances/{instanceId}:plan:
    post:
      operationId: planInstance
      summary: Run plugin Validate + 3-Way Diff + Preflight and persist frozen Plan
      responses:
        '200':
          description: Plan snapshot
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: instanceId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/instances/{instanceId}:apply:
    post:
      operationId: applyInstance
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          description: Operation queued or awaiting four-eyes approval
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: instanceId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/stacks:
    get:
      operationId: listStacks
      summary: List composite application stacks (ADR-067)
      responses:
        '200':
          description: OK
    post:
      operationId: createStack
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created with Kahn DAG
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/operations:
    get:
      operationId: listOperations
      summary: List operations
      responses:
        '200':
          description: OK
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/operations/{opId}:approve:
    post:
      operationId: approveOperation
      summary: Approve pending four-eyes operation (self-approval blocked in Go + SQL)
      responses:
        '200':
          description: Approved
        '403':
          $ref: '#/components/responses/Problem'
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: opId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/operations/{opId}:reject:
    post:
      operationId: rejectOperation
      summary: Reject pending four-eyes operation
      responses:
        '200':
          description: Rejected
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: opId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/operations/{opId}/events:
    get:
      operationId: streamOperationEvents
      summary: Lossless multi-replica SSE stream with Last-Event-ID replay (G1 §3)
      responses:
        '200':
          description: text/event-stream
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: opId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/approvals:
    get:
      operationId: listPendingApprovals
      summary: List pending four-eyes approvals
      responses:
        '200':
          description: OK
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/clusters/{instanceId}/kubeconfigs:
    get:
      operationId: listClusterKubeconfigs
      responses:
        '200':
          description: OK
    post:
      operationId: issueClusterKubeconfig
      summary: Issue short-lived RBAC kubeconfig (max 24h; cluster-admin max 4h; never system:masters)
      responses:
        '201':
          description: Issued kubeconfig
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: instanceId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/audit:
    get:
      operationId: listAuditLogs
      responses:
        '200':
          description: OK
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/secrets:rewrap:
    post:
      operationId: rewrapProjectSecrets
      summary: Re-wrap all project credential DEKs under latest KEK version
      responses:
        '200':
          description: Rewrapped count
          content:
            application/json:
              schema:
                type: object
                properties:
                  rewrapped:
                    type: integer
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/cmdb:sync:
    post:
      operationId: syncExternalCMDB
      summary: Push/sync external CMDB hosts into project
      responses:
        '200':
          description: Sync summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: integer
                  updated:
                    type: integer
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/operations/{opId}/report:
    get:
      operationId: exportOperationReport
      summary: Export Markdown or JSON operation execution report
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - markdown
          - json
      responses:
        '200':
          description: Operation report
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: opId
      in: path
      required: true
      schema:
        type: string
  /api/v1/audit:verify:
    post:
      operationId: verifyAuditChain
      summary: Verify SHA-256 / SM3 audit hash chain integrity
      responses:
        '200':
          description: Verification report
  /api/v1/projects/{projectId}/compliance:report:
    post:
      operationId: generateComplianceReport
      summary: Generate DJCP Level-3 & GM/T-0054 compliance evidence summary
      responses:
        '200':
          description: Compliance report
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/compliance:download:
    get:
      operationId: downloadComplianceEvidence
      summary: Download signed compliance evidence.tar.gz archive
      responses:
        '200':
          description: Gzip evidence archive
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/plugins/{product}:
    get:
      operationId: getPluginMetadata
      summary: Get plugin metadata, supported Day-2 operations, and x-kinstall-ui ParamSchema
      responses:
        '200':
          description: Plugin metadata
    parameters:
    - name: product
      in: path
      required: true
      schema:
        type: string
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List platform users and RBAC role bindings (admin only)
      responses:
        '200':
          description: User list
    post:
      operationId: createUser
      summary: Create local user with Argon2id password and role bindings
      responses:
        '201':
          description: Created user
  /api/v1/auth/tokens/{tokenId}:
    delete:
      operationId: revokeApiToken
      summary: Revoke an API token immediately
      responses:
        '204':
          description: Revoked
    parameters:
    - name: tokenId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/credentials:
    get:
      operationId: listCredentials
      summary: List project encrypted credential metadata (never returns secrets)
      responses:
        '200':
          description: Credential metadata list
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/credentials/{credId}:
    delete:
      operationId: deleteCredential
      summary: Delete credential from project vault
      responses:
        '204':
          description: Deleted
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: credId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/hosts:import:
    post:
      operationId: importHostsBulk
      summary: Bulk validate/import CMDB hosts from XLSX, CSV, or YAML
      responses:
        '200':
          description: Import result with row-level errors
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/hosts:discover:
    post:
      operationId: discoverHostsSubnet
      summary: Scan CIDR subnet for active SSH endpoints and capture SSH banners
      responses:
        '200':
          description: Discovered hosts
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/hosts/{hostId}:
    delete:
      operationId: deleteHost
      summary: Remove unclaimed host from CMDB
      responses:
        '204':
          description: Deleted
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: hostId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/hosts/{hostId}:check:
    post:
      operationId: checkHostBaseline
      summary: Check CMDB host against merged hostinit baseline profiles
      responses:
        '200':
          description: Drift findings
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: hostId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/hosts/{hostId}:init:
    post:
      operationId: initHost
      summary: Schedule 22-module hostinit Operation for a CMDB host
      responses:
        '202':
          description: Accepted Operation
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: hostId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/instances/{instanceId}:
    delete:
      operationId: deleteInstance
      summary: Delete instance record and release host claims
      responses:
        '204':
          description: Deleted
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: instanceId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/stacks:validate:
    post:
      operationId: validateStackYaml
      summary: Live Kahn topological sort & OutputSchema validation for Stack YAML
      responses:
        '200':
          description: Validated DAG
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/stacks/{stackId}:apply:
    post:
      operationId: applyStack
      summary: Queue layered Stack install Operation (with four-eyes guard in prod)
      responses:
        '202':
          description: Accepted Operation
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: stackId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/stacks/{stackId}:uninstall:
    post:
      operationId: uninstallStack
      summary: Queue reverse-layer Stack uninstall Operation (externalRefs untouched)
      responses:
        '202':
          description: Accepted Operation
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
    - name: stackId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/notification-channels:
    get:
      operationId: listNotificationChannels
      summary: List project notification channels (webhook/email/wecom/dingtalk/feishu)
      responses:
        '200':
          description: Channel list
    post:
      operationId: createNotificationChannel
      summary: Register a new notification channel
      responses:
        '201':
          description: Created channel
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/notification-channels:test:
    post:
      operationId: testNotificationChannels
      summary: Dispatch a test notification through storm-folding dispatcher
      responses:
        '200':
          description: Delivery counts
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/gitops/export:
    get:
      operationId: exportGitOpsYaml
      summary: Export project instances as deterministic GitOps YAML
      responses:
        '200':
          description: GitOps YAML
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/gitops:diff:
    post:
      operationId: diffGitOpsYaml
      summary: Diff desired GitOps YAML against live instances
      responses:
        '200':
          description: Diff entries and CI exit code
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
  /api/v1/projects/{projectId}/support-bundle:
    post:
      operationId: downloadSupportBundle
      summary: Collect and download redacted diagnostic support-bundle .tar.gz
      responses:
        '200':
          description: Gzip diagnostic bundle
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: string
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 ProblemDetails
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          pattern: ^KI-[A-Z]+-[0-9]{4}$
        instance:
          type: string
        traceId:
          type: string
        suggestion:
          type: string
          nullable: true
