name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spec-and-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Verify OS Spec SSOT (ADR-029)
        run: python3 spec/gen_os_docs.py --check
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - name: Run golangci-lint (v2 + depguard + gochecknoinits)
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
      - name: Dependency blacklist check (Redline 5)
        run: |
          ! grep -rn "openapi-typescript-codegen" web/package.json || (echo "CVE-2026-108551 forbidden"; exit 1)
          ! grep -rn "tjfoc/gmsm" go.mod || (echo "tjfoc/gmsm forbidden"; exit 1)
          ! grep -rn "mattn/go-sqlite3" go.mod || (echo "CGO sqlite forbidden"; exit 1)

  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - name: Unit & Golden Tests (-race)
        run: go test -race -count=1 ./...
      - name: Cross-Build Static Binaries (CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/kinstall-linux-amd64 ./cmd/kinstall
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o bin/kinstall-linux-arm64 ./cmd/kinstall
          ls -lh bin/

  web-ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build & Verify Offline Web UI (Zero External CDN)
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm run build
          ! grep -rnE 'https?://(cdn\.|fonts\.googleapis|unpkg\.com|jsdelivr\.net)' dist/ || (echo "External CDN forbidden"; exit 1)
