apiVersion: kinstall.io/v1alpha1
kind: PluginManifest
name: kubernetes
version: 1.1.0
sdkVersion: v1alpha1
type: Component
minPlatformVersion: 0.1.0
description: "Production pure-binary Kubernetes (1.35-1.38) with local APIServer proxy (127.0.0.1:8443), mixed amd64/arm64-4K/64K support, Calico nftables LCD, and etcd PITR."
products:
  - product: kubernetes
    versions: ">=1.35.0, <1.39.0"
    defaultVersion: "1.37.2"
    targets: [host-binary]
    licenseTier: green
platforms:
  arch: [amd64, arm64]
  pageSizes: [4096, 65536]
outputSchema:
  apiServerVIP: "string (Control-plane LB/VIP endpoint https://ip:6443)"
  caCertSecretId: "string (Encrypted root CA credential reference)"
  kubeconfigRef: "string (Managed cluster kubeconfig reference)"
driftIgnore:
  - "/etc/kinstall/apiserver-proxy/backends.json"
  - "/var/lib/kubelet/pki/*"
