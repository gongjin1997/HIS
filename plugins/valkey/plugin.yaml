apiVersion: kinstall.io/v1alpha1
kind: PluginManifest
name: valkey
version: 1.1.0
sdkVersion: v1alpha1
type: Component
minPlatformVersion: 0.1.0
description: "Valkey 9.1.4 / 9.2.0 (BSD-3) & optional Redis 8.x: standalone, replication-sentinel (create-only sentinel.conf), cluster (ring anti-affinity) across host-binary, host-container, and kubernetes."
products:
  - product: valkey
    versions: ">=8.0.0, <10.0.0"
    defaultVersion: "9.1.4"
    targets: [host-binary, host-container, kubernetes]
    licenseTier: green
  - product: redis
    versions: ">=7.2.0, <9.0.0"
    defaultVersion: "8.0.0"
    targets: [host-container, kubernetes]
    licenseTier: red
platforms:
  arch: [amd64, arm64]
  pageSizes: [4096, 65536]
outputSchema:
  endpoints: "string (host:port comma list)"
  tlsEnabled: "bool"
  adminAclSecretRef: "string"
  appAclSecretRef: "string"
driftIgnore:
  - "/etc/kinstall/valkey/*/sentinel.conf"
