version: "2"

run:
  timeout: 5m

linters:
  enable:
    - depguard
    - gochecknoinits
    - errcheck
    - errorlint
    - govet
    - staticcheck
    - gosec
    - bodyclose
    - sqlclosecheck
    - nilerr
  settings:
    depguard:
      rules:
        platform-pure:
          files:
            - "**/pkg/platform/**/*.go"
          deny:
            - pkg: "github.com/kinstall/kinstall/internal"
              desc: "系统底座 pkg/platform 严禁反向依赖业务层 internal/*"
        server-no-raw-drivers:
          files:
            - "**/internal/server/**/*.go"
          deny:
            - pkg: "modernc.org/sqlite"
              desc: "接入层严禁直连数据库驱动"
            - pkg: "github.com/jackc/pgx/v5"
              desc: "接入层严禁直连数据库驱动"
            - pkg: "github.com/uptrace/bun"
              desc: "接入层严禁直连 ORM"
        db-only-bun:
          files:
            - "**/internal/**/*.go"
          deny:
            - pkg: "github.com/uptrace/bun"
              desc: "数据库访问统一通过 pkg/platform/db 底座"
        no-forbidden-deps:
          files:
            - "$all"
          deny:
            - pkg: "github.com/mattn/go-sqlite3"
              desc: "需要 CGO，违反 CGO_ENABLED=0 静态单二进制铁律"
            - pkg: "gorm.io/gorm"
              desc: "禁止引入 gorm"
            - pkg: "github.com/tjfoc/gmsm"
              desc: "已停维，统一使用 github.com/emmansun/gmsm"
            - pkg: "plugin"
              desc: "Go plugin 不可移植，使用声明式 YAML 插件包"
    gosec:
      excludes:
        - G104
        - G304
        - G301
        - G302
        - G306
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
          - gosec
          - bodyclose
          - sqlclosecheck

formatters:
  enable:
    - gofmt
