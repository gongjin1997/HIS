      lifecycle: {eol: "2029-05-31", source: "R-OS-03；Rocky os-release SUPPORT_END"}
    baseline:
      kernel: "4.18.0-553"
      systemd: 239
      cgroup: v1
      nft: "1.0.4"
      glibc: "2.28"
      kernelUpgrade: {source: third-party, note: "第三方 LTS 内核（ELRepo kernel-lt 等，S3 复核）"}
      arm64: {pageSize: 64K}
    quirks: [Q-19, Q-23]

  - id: el-9
    display: RHEL / Rocky / AlmaLinux 9
    family: rhel-like
    priority: 100
    match: {id: [rhel, rocky, almalinux], versionId: 're:^9(\.|$)'}
