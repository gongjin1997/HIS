      pkgSource: online
      lifecycle: {eol: null, note: "未找到公开数据", source: "移动云镜像站"}
    baseline: {kernel: "4.19.0-553", systemd: 239, cgroup: v1, nft: "0.9.3", glibc: "2.28"}
    quirks: [Q-19]

  # ===================== openeuler =====================
  - id: openeuler-22.03-lts
    display: openEuler 22.03 LTS
    family: openeuler
    priority: 100
    match: {id: openEuler, versionId: "22.03", version: 're:LTS'}
    variants:
      sp: {from: version, pattern: 'LTS-SP(?P<v>\d+)', default: "0", labels: {"0": 基础版}}
    support:
      tier: P2
      evidence: measured
      samples: [oe2203, oe2203-arm64]
      pkgSource: online-frozen
      lifecycle: {eol: "2026-03-30", source: "openEuler 生命周期"}
    baseline:
      kernel: "5.10.0-342"
      systemd: 249
      cgroup: v1
      nft: "1.0.0"
      glibc: "2.34"
      arm64: {pageSize: 4K}
    quirks: [Q-03, Q-10, Q-25]

  - id: openeuler-24.03-lts
    display: openEuler 24.03 LTS
    family: openeuler
    priority: 100
    match: {id: openEuler, versionId: "24.03", version: 're:LTS'}
    variants:
      sp: {from: version, pattern: 'LTS-SP(?P<v>\d+)', default: "0", labels: {"0": 基础版}}
    support:
      tier: P0
      evidence: measured
      evidenceNote: 样本为 SP4
      samples: [oe2403, oe2403-arm64]
      pkgSource: online
      lifecycle:
        eol: null                   # 按 SP 判定
        byVariant:
          sp: {"0": "2026-05", "1": "2026-12", "2": "2026-04-24", "3": "2027-12", "4": "2027-03"}
        note: "按 SP 判定；SP4 之后可能转 SP5"
        source: "openEuler 生命周期、停维公告、论坛答复"
    baseline:
      kernel: "6.6.0-159"
      systemd: 255
      cgroup: v1
      nft: "1.0.8"
      glibc: "2.38"
      arm64: {pageSize: 4K, optional64k: kernel-64k}
    quirks: [Q-03, Q-10, Q-13, Q-25]

  - id: openeuler-innovation
    display: openEuler 创新版
    family: openeuler
    priority: 100
    match: {id: openEuler, not: {version: 're:LTS'}}
