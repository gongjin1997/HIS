      evidence: measured
      samples: [anolis23, anolis23-arm64]
      pkgSource: online
      lifecycle: {eol: "2033", source: "R-OS-04"}
    baseline:
      kernel: "6.6.102-8"
      systemd: 255
      cgroup: v2
      nft: "1.0.8"
      glibc: "2.38"
      arm64: {pageSize: 4K}
    quirks: [Q-03, Q-13]

  - id: alinux-3
