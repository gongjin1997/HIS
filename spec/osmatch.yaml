      lifecycle: {eol: "2035-05-31", source: "R-OS-03；Rocky os-release SUPPORT_END；AlmaLinux 10 active 至 2030-05-31"}
    baseline:
      kernel: "6.12.0-264"
      systemd: 257
      cgroup: v2-only
      nft: "1.1.5"
      glibc: "2.39"
      arm64: {pageSize: 4K, optional64k: kernel-64k}
    quirks: [Q-12, Q-20, Q-27]

  - id: ol-9
    display: Oracle Linux 9
    family: rhel-like
    priority: 100
    match: {id: ol, versionId: 're:^9(\.|$)'}
    support:
      tier: P2
      evidence: measured
      samples: [ol9]
      pkgSource: online
      lifecycle: {eol: "2032-06", extended: "2035-06", note: "Premier；Extended 至 2035-06", source: "Oracle Lifetime Support Policy"}
    baseline:
      kernel: "5.14.0-741"          # RHCK；9.7 起新装默认 UEK 8（6.12）
      kernelAlt: "UEK 8 6.12 / UEK 7 5.15"
