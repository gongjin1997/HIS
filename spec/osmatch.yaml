      sp:
        from: version
        pattern: '\((?P<v>[A-Za-z]+)\)'
        map: {tercel: SP1, sword: SP2, lance: SP3, halberd: SP3-2403}
      milestone: {from: file, path: /etc/.kyinfo, pattern: '^milestone=(?P<v>.+)$'}
    support:
      tier: P1
      evidence: measured
      evidenceNote: 样本为 SP3 2403；SP1 / SP2 未实测
      samples: [kylinv10, kylinv10-arm64]
      pkgSource: online
      lifecycle: {eol: null, note: "产品线 5+5+3 共 13 年；各 SP 停服日期未公开", source: "麒麟 V10 白皮书"}
    baseline:
      kernel: "4.19.90-89"
      systemd: 243
      cgroup: v1
      nft: "0.9.6"
      glibc: "2.28"
      arm64: {pageSize: 64K}
    quirks: [Q-03, Q-10, Q-15, Q-23, Q-26]

