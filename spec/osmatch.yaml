# kinstall OS 识别规则与支持矩阵（osmatch）—— S2 定稿
#
# 用途（ADR-024、ADR-029）：
#   1. 运行时：采集 /etc/os-release 等文件后按本文件匹配规则，得到规则 ID、适配器族、支持等级和变体；
#   2. 文档与测试：spec/gen_os_docs.py 校验本文件，用 research/repo_scan.json 中的实测 os-release
#      和 spec/osmatch_golden.yaml 中的文档样本做 golden 测试，并生成 03 §3.2 / §3.3 / §4.2 的表格。
#      文档里的这些表格不手改，改本文件后重新生成。
#
# 取值约定：
#   - 字符串：大小写不敏感的精确匹配；以 "re:" 开头为正则（RE2 语法子集，Go regexp 与 Python re 均可用）。
#   - 列表：任一元素命中即可（OR）；同一 match 内多个键之间为 AND。
#   - idLike：ID_LIKE 按空格拆分后任一词命中即可。
#   - 日期一律加引号；lifecycle 日期可写到年、月或日，按该期间的最后一天计算状态。
#   - 版本号（kernel、nft 等）加引号，避免被解析成浮点数。
apiVersion: kinstall.io/v1alpha1
kind: OSMatch
metadata:
  revision: "2026.11.26-1"          # 可独立于 kinstall 二进制发布（ADR-029）
  dataAsOf: "2026-11-25"            # 生命周期与基线数据的截止日期
  evidence: "03-A（2026-11-25 官方软件源实测）"
  eolSoonDays: 180                  # 距 EOL 不足该天数时状态为 eol-soon

# 全局底线：不满足时直接判为 unsupported，不再匹配规则
floor:
  arch: [amd64, arm64]
  kernelMin: "3.10"
  init: systemd                     # PID 1 必须是 systemd

# 适配器族：只描述“族”的默认行为；规则可用 overrides 覆盖
families:
  rhel-like:
    pkgType: rpm
    pkgManager: dnf
    lock: dnf-versionlock
    firewall: firewalld
    mac: selinux
    network: NetworkManager
    bootloader: grubby
    timeSync: chrony
  anolis:
    parent: rhel-like
  openeuler:
    parent: rhel-like
  kylin:
    parent: openeuler
    security: [kysec]
  uos:
    parent: per-rule                # 由规则的 parent 指定：a 版 → anolis，e 版 → openeuler
  suse:
    pkgType: rpm
    pkgManager: zypper
    lock: zypper-addlock
    firewall: firewalld
    mac: apparmor
    network: wicked
    bootloader: grub2-mkconfig
    timeSync: chrony
  debian-like:
    pkgType: deb
    pkgManager: apt
    lock: apt-mark-hold
    firewall: ufw
    mac: apparmor
    network: netplan
    bootloader: update-grub
    timeSync: chrony

# 规则字段：
#   id / display / family（/ parent）/ priority / match / variants / overrides
#   support: tier（P0 / P1 / P2 / unverified）、evidence（measured 实测 / represented 以同源发行版代表 /
#            documented 仅文档 / none）、samples（research/repo_scan.json 的键）、arch、cpu、pkgSource
#            （online / online-frozen 源仍在但已停更 / vault / licensed 需授权 / offline）、lifecycle
#   baseline: 默认源中的内核、systemd、编译默认 cgroup（v1 / v2 / hybrid / v1-only / v2-only）、nft、glibc、arm64 页大小；
#            kernelAlt（同源其他内核，仅展示）、kernelHwe（Ubuntu HWE）、kernelUpgrade（升级路径：official 厂商 / third-party 第三方）
#   quirks: 03 §4.7 的编号
# priority：精确规则 100（同 ID 下更细的变体 110）；兜底规则 10–30。同一优先级同时命中多条规则视为错误。
rules:
  # ===================== rhel-like：CentOS / RHEL 系 =====================
  - id: centos-7
    display: CentOS Linux 7
    family: rhel-like
    priority: 100
    match: {id: centos, versionId: "7"}
    overrides: {pkgManager: yum, lock: yum-versionlock}
    support:
      tier: P2
      evidence: measured
      samples: [centos7]
      pkgSource: vault
      lifecycle: {eol: "2024-06-30", source: "R-OS-01"}
    baseline: {kernel: "3.10.0-1160", systemd: 219, cgroup: v1-only, nft: "0.8", glibc: "2.17"}
    quirks: [Q-01, Q-22]

  - id: centos-8
    display: CentOS Linux 8
    family: rhel-like
    priority: 100
    match: {id: centos, versionId: "8", name: "CentOS Linux"}
    support:
      tier: P2
      evidence: measured
      samples: [centos8]
      pkgSource: vault
      lifecycle: {eol: "2021-12-31", source: "R-OS-01"}
    baseline: {kernel: "4.18.0-348", systemd: 239, cgroup: v1, nft: "0.9.3", glibc: "2.28"}
    quirks: [Q-01, Q-02, Q-19]

  - id: centos-stream-8
    display: CentOS Stream 8
    family: rhel-like
    priority: 100
    match: {id: centos, versionId: "8", name: "CentOS Stream"}
    support:
      tier: P2
      evidence: documented
      samples: []
      pkgSource: vault
      lifecycle: {eol: "2024-05-31", source: "CentOS 官网"}
    baseline: {kernel: "4.18.0", systemd: 239, cgroup: v1}
    quirks: [Q-01, Q-02]

  - id: centos-stream-9
    display: CentOS Stream 9
    family: rhel-like
    priority: 100
    match: {id: centos, versionId: "9", name: "CentOS Stream"}
    support:
      tier: P1
      evidence: measured
      samples: [stream9]
      pkgSource: online
      lifecycle: {eol: "2027-05-31", source: "R-OS-02"}
    baseline: {kernel: "5.14.0-765", systemd: 252, cgroup: v2, nft: "1.0.9", glibc: "2.34"}

  - id: centos-stream-10
    display: CentOS Stream 10
    family: rhel-like
    priority: 100
    match: {id: centos, versionId: "10", name: "CentOS Stream"}
    support:
      tier: P2
