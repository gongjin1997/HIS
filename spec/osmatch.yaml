      samples: [stream10]
      cpu: {amd64: x86-64-v3}
      pkgSource: online
      lifecycle: {eol: "2030-05-31", source: "R-OS-02"}
    baseline: {kernel: "6.12.0-284", systemd: 257, cgroup: v2-only, nft: "1.1.7", glibc: "2.39"}
    quirks: [Q-12, Q-20]

  - id: el-8
