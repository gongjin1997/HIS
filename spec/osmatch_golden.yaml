# osmatch golden 测试样本（spec/gen_os_docs.py 执行）
#
# 1. measured：research/repo_scan.json 中的全部实测 os-release（从官方 release 包解出）。
#    期望规则 = osmatch.yaml 中把该样本列入 support.samples 的规则；每个样本必须唯一命中。
#    这里只列需要额外断言变体的样本。
# 2. cases：文档 / 资料中的样本（kind: documented）和为边界条件构造的样本（kind: constructed）。
#    expect: null 表示不应命中任何规则（进入包管理器探测，仍失败则为 unknown）。
apiVersion: kinstall.io/v1alpha1
kind: OSMatchGolden
measured:
  oe2203: {sp: "4"}
  oe2403: {sp: "4"}
  oe2403-arm64: {sp: "4"}
  kylinv10: {sp: SP3-2403}
  kylinv11sp1: {release: "2603"}
  alinux3: {update: "14.1"}
  debian13: {point: "13.8"}
cases:
  - name: RHEL 9.6
    kind: documented
    expect: el-9
    osrelease: |
      NAME="Red Hat Enterprise Linux"
      VERSION="9.6 (Plow)"
      ID="rhel"
      ID_LIKE="fedora"
      VERSION_ID="9.6"
      PLATFORM_ID="platform:el9"
      PRETTY_NAME="Red Hat Enterprise Linux 9.6 (Plow)"
  - name: RHEL 8.10
    kind: documented
    expect: el-8
    osrelease: |
      NAME="Red Hat Enterprise Linux"
      ID="rhel"
      ID_LIKE="fedora"
      VERSION_ID="8.10"
      PLATFORM_ID="platform:el8"
  - name: AlmaLinux 9.6
    kind: documented
    expect: el-9
    osrelease: |
      NAME="AlmaLinux"
      ID="almalinux"
      ID_LIKE="rhel centos fedora"
      VERSION_ID="9.6"
      PLATFORM_ID="platform:el9"
  - name: AlmaLinux 10.1
    kind: documented
    expect: el-10
    osrelease: |
      NAME="AlmaLinux"
      ID="almalinux"
      ID_LIKE="rhel centos fedora"
      VERSION_ID="10.1"
      PLATFORM_ID="platform:el10"
  - name: CentOS Stream 8
    kind: documented
    expect: centos-stream-8
    osrelease: |
      NAME="CentOS Stream"
      VERSION="8"
      ID="centos"
      ID_LIKE="rhel fedora"
      VERSION_ID="8"
      PLATFORM_ID="platform:el8"
      PRETTY_NAME="CentOS Stream 8"
  - name: openEuler 24.03 LTS（基础版）
    kind: documented
    expect: openeuler-24.03-lts
    variants: {sp: "0"}
    osrelease: |
      NAME="openEuler"
      VERSION="24.03 (LTS)"
      ID="openEuler"
      VERSION_ID="24.03"
      PRETTY_NAME="openEuler 24.03 (LTS)"
  - name: openEuler 24.03 LTS SP1
    kind: documented
    expect: openeuler-24.03-lts
    variants: {sp: "1"}
    osrelease: |
      NAME="openEuler"
      VERSION="24.03 (LTS-SP1)"
      ID="openEuler"
      VERSION_ID="24.03"
      PRETTY_NAME="openEuler 24.03 (LTS-SP1)"
  - name: openEuler 24.09（创新版）
    kind: documented
    expect: openeuler-innovation
    osrelease: |
      NAME="openEuler"
      VERSION="24.09"
      ID="openEuler"
      VERSION_ID="24.09"
      PRETTY_NAME="openEuler 24.09"
  - name: openEuler 20.03 LTS SP4（已 EOL，无规则）
    kind: documented
    expect: fb-openeuler
    osrelease: |
      NAME="openEuler"
      VERSION="20.03 (LTS-SP4)"
      ID="openEuler"
      VERSION_ID="20.03"
  - name: 麒麟 V10 SP1
    kind: documented
    expect: kylin-v10
    variants: {sp: SP1}
    osrelease: |
      NAME="Kylin Linux Advanced Server"
      VERSION="V10 (Tercel)"
      ID="kylin"
      VERSION_ID="V10"
      PRETTY_NAME="Kylin Linux Advanced Server V10 (Tercel)"
  - name: 麒麟 V10 SP2
    kind: documented
    expect: kylin-v10
    variants: {sp: SP2}
    osrelease: |
      NAME="Kylin Linux Advanced Server"
      VERSION="V10 (Sword)"
      ID="kylin"
      VERSION_ID="V10"
  - name: 麒麟 V10 SP3 2303
    kind: documented
    expect: kylin-v10
    variants: {sp: SP3, milestone: Server-V10-SP3-General-Release-2303}
    osrelease: |
      NAME="Kylin Linux Advanced Server"
      VERSION="V10 (Lance)"
      ID="kylin"
      VERSION_ID="V10"
    files:
      /etc/.kyinfo: |
        [dist]
        name=Kylin
        milestone=Server-V10-SP3-General-Release-2303
  - name: 麒麟 V11 后续版本（构造）
    kind: constructed
    expect: fb-kylin
    osrelease: |
      NAME="Kylin Linux Advanced Server"
      VERSION="V11 (swan27)"
      ID="kylin"
      VERSION_ID="V11"
  - name: 统信 UOS Server 20 1070e
    kind: documented
    expect: uos-20-e
    variants: {minor: "1070"}
    osrelease: |
      NAME="UOS Server 20"
      VERSION="20"
      ID="uos"
      VERSION_ID="20"
      PRETTY_NAME="UOS Server 20"
      VERSION_CODENAME=fuyu
      PLATFORM_ID="platform:uel20"
    files:
      /etc/os-version: |
        [Version]
        SystemName=UOS Server
        ProductType=Server
        MinorVersion=1070
  - name: 统信 UOS Server 20 1070a
    kind: documented
    expect: uos-20-a
    variants: {minor: "1070"}
    osrelease: |
      NAME="UOS Server 20"
      ID="uos"
      VERSION_ID="20"
      VERSION_CODENAME=kongzi
      PLATFORM_ID="platform:uelc20"
    files:
      /etc/os-version: |
        [Version]
        SystemName=UOS Server
        ProductType=Server
        MinorVersion=1070
  - name: 统信 UOS V25（构造，os-release 未见公开样例）
    kind: constructed
    expect: fb-uos
    osrelease: |
      ID="uos"
      VERSION_ID="25"
  - name: CTyunOS（构造，openEuler 衍生）
    kind: constructed
    expect: fb-openeuler
    osrelease: |
      ID="ctyunos"
      VERSION_ID="23.01"
    files:
      /etc/openEuler-release: "openEuler release 22.03 (LTS-SP1)"
  - name: 龙蜥衍生版（构造）
    kind: constructed
    expect: fb-anolis
    osrelease: |
      ID="example"
      ID_LIKE="rhel fedora centos anolis"
      VERSION_ID="8"
  - name: Alibaba Cloud Linux 2（构造，已停止支持）
    kind: constructed
    expect: fb-rhel
    osrelease: |
      ID="alinux"
      ID_LIKE="rhel fedora centos"
      VERSION_ID="2.1903"
  - name: OpenCloudOS 8（构造）
    kind: constructed
    expect: fb-opencloudos
    osrelease: |
      ID="opencloudos"
      ID_LIKE="rhel fedora centos"
      VERSION_ID="8.8"
  - name: Oracle Linux 8.10
    kind: documented
    expect: fb-rhel
    osrelease: |
      NAME="Oracle Linux Server"
      VERSION="8.10"
      ID="ol"
      ID_LIKE="fedora"
      VERSION_ID="8.10"
      PLATFORM_ID="platform:el8"
  - name: SLES 15 SP6
    kind: documented
    expect: fb-suse
    osrelease: |
      NAME="SLES"
      VERSION="15-SP6"
      VERSION_ID="15.6"
      ID="sles"
      ID_LIKE="suse"
  - name: Ubuntu 25.10（非 LTS）
    kind: documented
    expect: fb-debian
    osrelease: |
      NAME="Ubuntu"
      ID=ubuntu
      ID_LIKE=debian
      VERSION_ID="25.10"
  - name: Debian testing（forky）
    kind: constructed
    expect: fb-debian
    osrelease: |
      PRETTY_NAME="Debian GNU/Linux forky/sid"
      NAME="Debian GNU/Linux"
      VERSION_CODENAME=forky
      ID=debian
  - name: Fedora（构造）
    kind: constructed
    expect: fb-rhel
    osrelease: |
      NAME="Fedora Linux"
      ID=fedora
      VERSION_ID=41
    files:
      /etc/redhat-release: "Fedora release 41"
  - name: Arch Linux（构造，不支持）
    kind: constructed
    expect: null
    osrelease: |
      NAME="Arch Linux"
      ID=arch
