# kinstall 逻辑包映射（pkgmap）—— 由 spec/gen_pkgmap.py 生成，勿手改；人工调整请改生成脚本或补测数据
# 运行时：先按 provides 检查命令是否已存在（command -v），存在即满足；否则按解析出的包名安装。
# pkg: null 表示该系统的官方源中没有此包：required 阻断并提示补离线包，optional 跳过并在报告中注明。
# conflicts：发行版自带的容器 / K8s 包，只检测冲突、不安装（ADR-026）。
